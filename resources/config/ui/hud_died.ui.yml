  - text_block: hud_diedtext
    - text: "YOU DIED"
    - text_font: foulfiend
    - dim: 0.3, 0.3
    - pos: 0.35, 0.35
  - button: hud_diedlevel
    - texture: ui/border1x1.tga
    - text: "Restart level"
    - text_font: foulfiend
    - dim: 0.3, 0.15
    - pos: 0.35, 0.6
    - text_size: 0.8
    - onclick: hud_diedreload
  - button: hud_diedmainmenu
    - texture: ui/border1x1.tga
    - text: "Return to menu"
    - text_font: foulfiend
    - dim: 0.3, 0.15
    - pos: 0.35, 0.8
    - text_size: 0.8
    - onclick: hud_diedreturn
