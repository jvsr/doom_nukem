- main: main
  - image: background
     - color: #007033
  - panel: menu
    - pos: 0.75, 0.9
    - dim: 0.5, 0.8
    - image: i_logo
      - draw_method: centered
      - texture: splash/splash.tga
      - dim: 1, 0.2
    - button: b_missions
      - pos: 0.85, 0.25
      - dim: 0.7, 0.15
      - color: #d16c41
      - text: "Missions"
      - text_draw_method: scaled
      - onclick: button_menu_missions
    - button: b_options
      - pos: 0.85, 0.45
      - dim: 0.7, 0.15
      - color: #d16c41
      - text: "Options"
      - onclick: button_menu_options
    - button: b_quit
      - pos: 0.85, 0.65
      - dim: 0.7, 0.15
      - color: #d16c41
      - text: "Quit"
      - onclick: button_menu_quit
