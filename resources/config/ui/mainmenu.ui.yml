- main: mainmenu
  - image: background
     - color: #c92020
  - panel: menu
    - pos: 0.75, 0.9
    - dim: 0.5, 0.8
    - image: logo
      - draw_method: centered
      - texture: splash/splash.tga
      - dim: 1, 0.2
    - button: missions_button
      - pos: 0.85, 0.25
      - dim: 0.7, 0.15
      - color: #d16c41
      - text: "Missions"
      - text_draw_method: scaled
      - onclick: button_menu_missions
    - button: options_button
      - pos: 0.85, 0.45
      - dim: 0.7, 0.15
      - color: #d16c41
      - text: "Options"
      - onclick: button_menu_options
    - button: quit_button
      - pos: 0.85, 0.65
      - dim: 0.7, 0.15
      - color: #d16c41
      - text: "Quit"
      - onclick: button_menu_quit
